name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, Knip, types and registries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm knip

      - run: pnpm typecheck

      - run: pnpm registry:check

      - run: pnpm matrix --check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Google Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
          else
            pnpm --filter @esuiss/web exec playwright install --with-deps chrome
          fi

      - run: pnpm test

  changes:
    name: Native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      swift-cli: ${{ steps.filter.outputs.swift-cli }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          all() {
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "swift-cli=true" >> "$GITHUB_OUTPUT"
            echo "kotlin=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            all
          fi
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" --jq '.files[].filename'); then
            all
          fi
          if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ]; then
            all
          fi
          changed() {
            if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi
          }
          shared='packages/tokens/|packages/mobile/scripts/build-tokens\.mjs|\.github/workflows/ci\.yml'
          echo "swift=$(changed "^(packages/mobile/swiftui/|${shared})")" >> "$GITHUB_OUTPUT"
          echo "swift-cli=$(changed "^(packages/mobile/swiftui/|packages/mobile/registry|packages/cli/|scripts/compat-swift\.mjs|${shared})")" >> "$GITHUB_OUTPUT"
          echo "kotlin=$(changed "^(packages/mobile/kotlin/|${shared})")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  swift:
    name: SwiftUI
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/mobile/swiftui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ runner.os }}-${{ hashFiles('packages/mobile/swiftui/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: xcodebuild -scheme EsuissUI -destination 'generic/platform=iOS Simulator' -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" build -quiet

      - name: Test
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$device" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            exit 1
          fi
          xcodebuild -scheme EsuissUI -destination "id=${device}" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" test -quiet

  swift-cli:
    name: SwiftUI install (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.swift-cli == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project:
          - package
          - xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Add every item to a new project and build it
        run: node scripts/compat-swift.mjs --project=${{ matrix.project }}

  kotlin:
    name: Jetpack Compose
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/mobile/kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Compile
        run: ./gradlew --no-daemon :ui:compileDebugKotlin :catalog:compileDebugKotlin :ui:compileDebugAndroidTestKotlin
