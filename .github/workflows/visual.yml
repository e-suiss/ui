name: Visual

on:
  push:
    branches:
      - main
    paths:
      - "packages/web/**"
      - "scripts/matrix.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  pull_request:
    paths:
      - "packages/web/**"
      - "scripts/matrix.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_call:
    inputs:
      update:
        type: string
        default: "no"
  workflow_dispatch:
    inputs:
      update:
        description: Take new reference screenshots, to review as artifacts or to publish to e-suiss/ui-baselines
        type: choice
        options:
          - "no"
          - review
          - publish
        default: "no"

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update != 'no' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      visual: ${{ steps.matrix.outputs.visual }}
      run: ${{ steps.changes.outputs.run }}
      base: ${{ steps.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            base="$CHANGED_BASE"
          elif [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "23 2 * * *" ]; then
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow visual.yml --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          node scripts/changed.mjs --platform=web --base="$base" | tee -a "$GITHUB_OUTPUT"

      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          if [ -n "$BASE" ] && [ "$EVENT" != "schedule" ]; then
            echo "visual=$(node scripts/matrix.mjs web-visual-pairs)" >> "$GITHUB_OUTPUT"
          else
            visual=$(node scripts/matrix.mjs web-visual)
            icons=$(node scripts/matrix.mjs web-icons)
            echo "visual=$(jq -cn --argjson a "$visual" --argjson b "$icons" '{include: ($a.include + $b.include)}')" >> "$GITHUB_OUTPUT"
          fi

  visual:
    needs: matrix
    if: needs.matrix.outputs.run == 'true'
    name: Screenshots (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.visual) }}
    env:
      STYLE: ${{ matrix.style || 'suiss' }}
      ICONS: ${{ matrix.icons }}
      RTL: ${{ matrix.rtl && '1' || '' }}
      VISUAL: "1"
      PROJECT: ${{ matrix.base == 'base' && 'examples' || format('examples-{0}', matrix.base) }}
      SCREENSHOTS: ${{ matrix.icons && format('icons-{0}', matrix.icons) || matrix.style }}
      ARTIFACT: ${{ matrix.base }}-${{ matrix.icons && format('icons-{0}', matrix.icons) || matrix.style }}${{ matrix.rtl && '-rtl' || '' }}
      BASE: ${{ needs.matrix.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ needs.matrix.outputs.base && '0' || '1' }}

      - name: Check out the reference screenshots
        if: env.UPDATE != 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: e-suiss/ui-baselines
          path: packages/web/tests/screenshots
          sparse-checkout: web/${{ matrix.base }}/${{ env.SCREENSHOTS }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Google Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
          else
            pnpm --filter @esuiss/web exec playwright install --with-deps chrome
          fi

      - name: Take every example in ${{ matrix.name }}
        working-directory: packages/web
        run: |
          flags=(--project "$PROJECT")
          if [ -n "$BASE" ]; then
            flags+=(--changed "$BASE" --passWithNoTests)
          fi
          if [ "$UPDATE" = "true" ]; then
            pnpm exec vitest run "${flags[@]}" --update
          elif [ ! -d "tests/screenshots/web/${{ matrix.base }}/$SCREENSHOTS" ]; then
            echo "::notice title=No reference screenshots::e-suiss/ui-baselines has no screenshots for ${{ matrix.name }} yet, so this run only checks that every example renders. Run the Visual workflow with update set to publish to add them."
            pnpm exec vitest run "${flags[@]}" --update
          else
            pnpm exec vitest run "${flags[@]}"
          fi

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: differences-${{ env.ARTIFACT }}
          path: |
            packages/web/.vitest/visual
            packages/web/tests/screenshots/web
          if-no-files-found: ignore

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: findings-${{ env.ARTIFACT }}
          path: packages/web/.vitest/visual-findings
          if-no-files-found: ignore

      - name: Upload the new reference screenshots
        if: env.UPDATE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: baselines-${{ env.ARTIFACT }}
          path: packages/web/tests/screenshots/web
          if-no-files-found: error

  publish:
    needs: visual
    if: github.event_name == 'workflow_dispatch' && inputs.update == 'publish' && github.ref == 'refs/heads/main'
    name: Publish the reference screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ui-baselines
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: baselines-*
          path: ${{ runner.temp }}/baselines/web
          merge-multiple: true

      - name: Replace the web screenshots in e-suiss/ui-baselines
        env:
          BASELINES_KEY: ${{ secrets.BASELINES_KEY }}
          SOURCE: ${{ github.sha }}
        run: scripts/publish-baselines.sh web "${{ runner.temp }}/baselines/web"
