name: Visual

on:
  push:
    branches:
      - main
    paths:
      - "packages/web/**"
      - "scripts/matrix.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  pull_request:
    paths:
      - "packages/web/**"
      - "scripts/matrix.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  workflow_dispatch:
    inputs:
      update:
        description: Take new reference screenshots, to review as artifacts or to publish to e-suiss/ui-baselines
        type: choice
        options:
          - "no"
          - review
          - publish
        default: "no"

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update != 'no' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.matrix.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: matrix
        run: echo "visual=$(node scripts/matrix.mjs web-visual)" >> "$GITHUB_OUTPUT"

  visual:
    needs: matrix
    name: Screenshots (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.visual) }}
    env:
      STYLE: ${{ matrix.style }}
      RTL: ${{ matrix.rtl && '1' || '' }}
      VISUAL: "1"
      PROJECT: ${{ matrix.base == 'base' && 'examples' || format('examples-{0}', matrix.base) }}
      ARTIFACT: ${{ matrix.base }}-${{ matrix.style }}${{ matrix.rtl && '-rtl' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out the reference screenshots
        if: env.UPDATE != 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: e-suiss/ui-baselines
          path: packages/web/tests/screenshots
          sparse-checkout: web/${{ matrix.base }}/${{ matrix.style }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Google Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
          else
            pnpm --filter @esuiss/web exec playwright install --with-deps chrome
          fi

      - name: Take every example in ${{ matrix.name }}
        working-directory: packages/web
        run: |
          if [ "$UPDATE" = "true" ]; then
            pnpm exec vitest run --project "$PROJECT" --update
          elif [ ! -d "tests/screenshots/web/${{ matrix.base }}/${{ matrix.style }}" ]; then
            echo "::notice title=No reference screenshots::e-suiss/ui-baselines has no screenshots for ${{ matrix.name }} yet, so this run only checks that every example renders. Run the Visual workflow with update set to publish to add them."
            pnpm exec vitest run --project "$PROJECT" --update
          else
            pnpm exec vitest run --project "$PROJECT"
          fi

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: differences-${{ env.ARTIFACT }}
          path: |
            packages/web/.vitest/visual
            packages/web/tests/screenshots/web
          if-no-files-found: ignore

      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: findings-${{ env.ARTIFACT }}
          path: packages/web/.vitest/visual-findings
          if-no-files-found: ignore

      - name: Upload the new reference screenshots
        if: env.UPDATE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: baselines-${{ env.ARTIFACT }}
          path: packages/web/tests/screenshots/web
          if-no-files-found: error

  publish:
    needs: visual
    if: github.event_name == 'workflow_dispatch' && inputs.update == 'publish' && github.ref == 'refs/heads/main'
    name: Publish the reference screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the deploy key
        env:
          BASELINES_KEY: ${{ secrets.BASELINES_KEY }}
        run: |
          if [ -z "$BASELINES_KEY" ]; then
            echo "::error title=Missing secret BASELINES_KEY::BASELINES_KEY is not set, so e-suiss/ui-baselines cannot be updated. Create a deploy key with write access in e-suiss/ui-baselines (Settings > Deploy keys), add its private key as the BASELINES_KEY secret in e-suiss/ui (Settings > Secrets and variables > Actions), then run the Visual workflow again with update set to publish."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: baselines-*
          path: ${{ runner.temp }}/baselines/web
          merge-multiple: true

      - name: Replace e-suiss/ui-baselines with these screenshots
        env:
          BASELINES_KEY: ${{ secrets.BASELINES_KEY }}
          SOURCE: ${{ github.sha }}
        working-directory: ${{ runner.temp }}/baselines
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2> /dev/null
          printf '%s\n' "$BASELINES_KEY" > ~/.ssh/baselines
          chmod 600 ~/.ssh/baselines
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/baselines -o IdentitiesOnly=yes"
          git init --quiet --initial-branch=main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "chore: reference screenshots for e-suiss/ui@$SOURCE"
          git push --force git@github.com:e-suiss/ui-baselines.git main
