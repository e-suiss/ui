name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/cli packages/tailwind; do
            PACKAGE_VERSION=$(node -p "require('./$dir/package.json').version")
            if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $dir version $PACKAGE_VERSION." >&2
              exit 1
            fi
          done

      - name: Check registries
        run: |
          node scripts/build-registry.mjs --check
          (cd mobile && node scripts/build-registry.mjs --check)

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/cli packages/tailwind; do
            NAME=$(node -p "require('./$dir/package.json').name")
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION is already published."
              continue
            fi
            set +e
            OUTPUT=$(cd "$dir" && npm publish 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -qiE "E409|cannot publish over"; then
                echo "$NAME@$VERSION is already published."
              else
                exit "$STATUS"
              fi
            fi
          done

      - name: Publish the Swift and Kotlin repositories
        env:
          SWIFT_MIRROR_KEY: ${{ secrets.SWIFT_MIRROR_KEY }}
          KOTLIN_MIRROR_KEY: ${{ secrets.KOTLIN_MIRROR_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2> /dev/null
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            if [ -z "$2" ]; then
              echo "::warning::No deploy key for e-suiss/$3; it was not updated."
              return
            fi
            echo "$2" > ~/.ssh/$3
            chmod 600 ~/.ssh/$3
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/$3 -o IdentitiesOnly=yes"
            rm -rf "/tmp/$3"
            git clone --quiet "git@github.com:e-suiss/$3.git" "/tmp/$3"
            find "/tmp/$3" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R "$1/." "/tmp/$3/"
            git -C "/tmp/$3" add -A
            git -C "/tmp/$3" diff --cached --quiet || git -C "/tmp/$3" commit --quiet -m "chore(release): $GITHUB_REF_NAME"
            git -C "/tmp/$3" tag "$GITHUB_REF_NAME"
            git -C "/tmp/$3" push --quiet origin HEAD:main "refs/tags/$GITHUB_REF_NAME"
            unset GIT_SSH_COMMAND
          }
          publish mobile/swiftui "$SWIFT_MIRROR_KEY" uim-swift
          publish mobile/kotlin "$KOTLIN_MIRROR_KEY" uim-kotlin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2> /dev/null || true)
          RANGE="${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$RANGE"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "npx @esuiss/ui@${GITHUB_REF_NAME#v} init"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
