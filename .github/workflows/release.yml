name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $PACKAGE_VERSION." >&2
            exit 1
          fi
          if npm view "@esuiss/uim@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check registry
        run: node scripts/build-registry.mjs --check

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        working-directory: packages/cli
        run: npm publish

      - name: Publish the Swift package
        env:
          SWIFT_MIRROR_KEY: ${{ secrets.SWIFT_MIRROR_KEY }}
        run: |
          if [ -z "$SWIFT_MIRROR_KEY" ]; then
            echo "::warning::SWIFT_MIRROR_KEY is not set; e-suiss/uim-swift was not updated."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SWIFT_MIRROR_KEY" > ~/.ssh/uim_swift
          chmod 600 ~/.ssh/uim_swift
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2> /dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/uim_swift -o IdentitiesOnly=yes"
          git subtree split --prefix=swiftui --branch swift-release
          git push git@github.com:e-suiss/uim-swift.git swift-release:main
          git push git@github.com:e-suiss/uim-swift.git "swift-release:refs/tags/$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2> /dev/null || true)
          RANGE="${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$RANGE"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "npx @esuiss/uim@${GITHUB_REF_NAME#v} init"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
