name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/cli packages/tailwind; do
            PACKAGE_VERSION=$(node -p "require('./$dir/package.json').version")
            if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $dir version $PACKAGE_VERSION." >&2
              exit 1
            fi
          done

      - name: Check registry
        run: node scripts/build-registry.mjs --check

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for dir in packages/cli packages/tailwind; do
            NAME=$(node -p "require('./$dir/package.json').name")
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION is already published."
              continue
            fi
            set +e
            OUTPUT=$(cd "$dir" && npm publish 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -qiE "E409|cannot publish over"; then
                echo "$NAME@$VERSION is already published."
              else
                exit "$STATUS"
              fi
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2> /dev/null || true)
          RANGE="${PREVIOUS:+$PREVIOUS..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$RANGE"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "npx @esuiss/ui@${GITHUB_REF_NAME#v} init"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
