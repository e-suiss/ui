name: Visual (Android) retry

on:
  workflow_run:
    workflows:
      - Visual (Android)
    types:
      - completed

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    name: Re-run the screenshots of an emulator that came up wrong
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          for job in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs" --paginate --jq '.jobs[] | select(.conclusion == "failure" and (.name | startswith("Screenshots"))) | .id'); do
            log=$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" --allow-escape-sequences)
            if grep -q "The screen size does not match the reference screenshots" <<< "$log" || ! grep -q "Cropping" <<< "$log"; then
              gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
          done
