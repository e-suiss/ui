name: Visual (SwiftUI)

on:
  push:
    branches:
      - main
    paths:
      - "packages/mobile/swiftui/Package.swift"
      - "packages/mobile/swiftui/Package.resolved"
      - "packages/mobile/swiftui/Sources/**"
      - "packages/mobile/swiftui/Catalog/**"
      - "packages/mobile/scripts/simulator.mjs"
      - "packages/mobile/scripts/visual-native.mjs"
      - "packages/mobile/scripts/visual-swiftui.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-swiftui.yml"
  pull_request:
    paths:
      - "packages/mobile/swiftui/Package.swift"
      - "packages/mobile/swiftui/Package.resolved"
      - "packages/mobile/swiftui/Sources/**"
      - "packages/mobile/swiftui/Catalog/**"
      - "packages/mobile/scripts/simulator.mjs"
      - "packages/mobile/scripts/visual-native.mjs"
      - "packages/mobile/scripts/visual-swiftui.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual-swiftui.yml"
  workflow_call:
    inputs:
      update:
        type: string
        default: "no"
      only:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      update:
        description: Take new reference screenshots, to review as artifacts or to publish to e-suiss/ui-baselines
        type: choice
        options:
          - "no"
          - review
          - publish
        default: "no"
      only:
        description: Comma-separated story ids to take instead of every story
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: visual-swiftui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update != 'no' }}
  APP: packages/mobile/swiftui/Catalog/build/Build/Products/Release-iphonesimulator/Catalog.app

jobs:
  changes:
    name: Choose the stories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.changes.outputs.run }}
      only: ${{ steps.changes.outputs.only }}
      shards: ${{ steps.changes.outputs.shards }}
      count: ${{ steps.changes.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: changes
        env:
          BASE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event.pull_request.base.sha || github.event.before) || '' }}
          ONLY: ${{ inputs.only }}
        run: node scripts/changed.mjs --platform=swift --base="$BASE" --only="$ONLY" --shards=4 --per-shard=15 | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Build the catalog
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build the catalog
        working-directory: packages/mobile/swiftui/Catalog
        run: xcodebuild -project Catalog.xcodeproj -scheme Catalog -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build build -quiet

      - name: Pack the catalog
        run: tar -czf "$RUNNER_TEMP/catalog.tar.gz" -C "$(dirname "$APP")" Catalog.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-swiftui
          path: ${{ runner.temp }}/catalog.tar.gz
          retention-days: 1

  visual:
    needs: [changes, build]
    name: Screenshots (SwiftUI ${{ matrix.shard }}/${{ needs.changes.outputs.count }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out the reference screenshots
        if: env.UPDATE != 'true'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: e-suiss/ui-baselines
          path: packages/mobile/tests/screenshots
          sparse-checkout: mobile/swiftui

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @esuiss/mobile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: app-swiftui
          path: ${{ runner.temp }}

      - name: Unpack the catalog
        run: tar -xzf "$RUNNER_TEMP/catalog.tar.gz" -C "$RUNNER_TEMP"

      - name: Take every story
        working-directory: packages/mobile
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.count }}
          ONLY: ${{ needs.changes.outputs.only }}
        run: |
          flags=()
          if [ -n "$ONLY" ]; then
            flags+=("--only=$ONLY")
          fi
          if [ "$UPDATE" = "true" ]; then
            flags+=(--update)
          elif [ ! -d tests/screenshots/mobile/swiftui ]; then
            echo "::notice title=No reference screenshots::e-suiss/ui-baselines has no SwiftUI screenshots yet, so this run only checks that every story renders. Run the Visual (SwiftUI) workflow with update set to publish to add them."
            flags+=(--update)
          fi
          node scripts/visual-swiftui.mjs --app="$RUNNER_TEMP/Catalog.app" --shard="$SHARD" "${flags[@]}"

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: differences-swiftui-${{ matrix.shard }}
          path: packages/mobile/.visual/swiftui
          if-no-files-found: ignore

      - name: Upload the new reference screenshots
        if: env.UPDATE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: baselines-swiftui-${{ matrix.shard }}
          path: packages/mobile/tests/screenshots/mobile
          if-no-files-found: ${{ inputs.only && 'ignore' || 'error' }}

  publish:
    needs: visual
    if: github.event_name == 'workflow_dispatch' && (inputs.update == 'publish') && github.ref == 'refs/heads/main'
    name: Publish the reference screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ui-baselines
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: baselines-swiftui-*
          merge-multiple: true
          path: ${{ runner.temp }}/screenshots/mobile

      - name: Replace the SwiftUI screenshots in e-suiss/ui-baselines
        env:
          BASELINES_KEY: ${{ secrets.BASELINES_KEY }}
          SOURCE: ${{ github.sha }}
          ONLY: ${{ inputs.only }}
        run: scripts/publish-baselines.sh mobile/swiftui "${{ runner.temp }}/screenshots/mobile/swiftui"
