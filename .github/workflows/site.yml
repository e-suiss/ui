name: Site

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/web/**"
      - "packages/mobile/**"
      - "packages/cli/lib/**"
      - "packages/tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: e-suiss/infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra

      - name: Roll out the image
        working-directory: infra
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          tag="sha-${GITHUB_SHA:0:7}"
          image="ghcr.io/${GITHUB_REPOSITORY}:${tag}@${DIGEST}"
          sed -i -E "s#image: ghcr.io/${GITHUB_REPOSITORY}:[^ ]+#image: ${image}#" kubernetes/docs/app/ui.yaml
          if git diff --quiet; then
            echo "Already on ${image}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(docs): roll ui to ${tag}"
          for _ in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

      - name: Wait for every replica to serve the new build
        timeout-minutes: 20
        run: |
          url="https://ui.suiss.app/"
          needed=10
          streak=0
          build=""
          deadline=$((SECONDS + 1080))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            build=$(curl -fsSI --max-time 10 "${url}?deploy=${GITHUB_RUN_ID}-${attempt}" | tr -d '\r' | awk 'tolower($1) == "x-build:" { print $2 }' || true)
            if [ "$build" = "$GITHUB_SHA" ]; then
              streak=$((streak + 1))
              echo "Serving ${build} (${streak}/${needed})"
              if [ "$streak" -ge "$needed" ]; then
                exit 0
              fi
              sleep 3
            else
              if [ "$streak" -gt 0 ]; then
                echo "Got ${build:-no X-Build header} after ${streak} matching responses; the rollout is still in progress"
              else
                echo "Still serving ${build:-unknown}"
              fi
              streak=0
              sleep 10
            fi
          done
          echo "::error::Timed out waiting for ${GITHUB_SHA}; last response was ${build:-unknown}"
          exit 1

      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          path: ui

      - name: Purge the cache
        id: purge
        working-directory: ui
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge-cache.mjs

      - name: Notify IndexNow
        working-directory: ui
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          since=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            since=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BEFORE}" --jq .commit.committer.date || true)
          fi
          echo "Submitting pages changed since ${since:-the last 2 days}"
          node scripts/indexnow.mjs ${since:+"--since=$since"}

      - name: Purge the cache again
        if: ${{ !cancelled() && steps.purge.outcome == 'success' }}
        working-directory: ui
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          sleep 60
          node scripts/purge-cache.mjs
