name: Compatibility

on:
  push:
    branches:
      - main
    paths:
      - "packages/web/**"
      - "packages/cli/**"
      - "scripts/compat.mjs"
      - "scripts/compat-batch.mjs"
      - "scripts/matrix.mjs"
      - "worker.js"
      - "apps/ui/next.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/compat.yml"
  pull_request:
    paths:
      - "packages/web/**"
      - "packages/cli/**"
      - "scripts/compat.mjs"
      - "scripts/compat-batch.mjs"
      - "scripts/matrix.mjs"
      - "worker.js"
      - "apps/ui/next.config.ts"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/compat.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Also install every item with every style, icon library, base, framework and CLI
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      options: ${{ steps.matrix.outputs.options }}
      install: ${{ steps.matrix.outputs.install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: matrix
        run: |
          echo "options=$(node scripts/matrix.mjs web-options --group=base,framework)" >> "$GITHUB_OUTPUT"
          echo "install=$(node scripts/matrix.mjs web-install --group=base,framework,cli)" >> "$GITHUB_OUTPUT"

  options:
    needs: matrix
    name: Options (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.options) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install Yarn and Bun
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin" yarn
          corepack install --global yarn@4.18.1
          npm install --global bun@1.4.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the registry tools
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @esuiss/web

      - name: Install Google Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
          else
            pnpm --filter @esuiss/web exec playwright install --with-deps chrome
          fi

      - name: Install every item with ${{ matrix.count }} sets of options
        env:
          RUNS: ${{ matrix.runs }}
        run: node scripts/compat-batch.mjs

  install:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    needs: matrix
    name: Every style and icon library (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.install) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install Yarn and Bun
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin" yarn
          corepack install --global yarn@4.18.1
          npm install --global bun@1.4.3
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the registry tools
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @esuiss/web

      - name: Install Google Chrome
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
          else
            pnpm --filter @esuiss/web exec playwright install --with-deps chrome
          fi

      - name: Install every item in ${{ matrix.count }} apps
        env:
          RUNS: ${{ matrix.runs }}
        run: node scripts/compat-batch.mjs

  compat-rn:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: React Native (${{ matrix.styling }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        styling:
          - uniwind
          - nativewind
          - stylesheet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install the registry tools
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @esuiss/site

      - name: Install the items in a new Expo app
        run: pnpm compat:rn --styling=${{ matrix.styling }}
