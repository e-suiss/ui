name: Documentation
description: Report a mistake, a missing example or something unclear on suiss.app/ui.
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page.
      placeholder: https://suiss.app/ui/docs/components/button
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
