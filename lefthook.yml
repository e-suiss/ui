pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged
    registry:
      glob: "{components/ui/*.tsx,hooks/*.ts}"
      run: node scripts/build-registry.mjs && git add registry.json

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    knip:
      run: pnpm knip
    registry:
      run: pnpm registry:check
