pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged
    web-styles:
      glob: "{packages/web/styles/style-suiss*.css,packages/web/styles/structural.json,packages/cli/lib/styles.mjs,packages/web/styles/vendor/*.css,packages/web/scripts/build-styles.mjs,packages/web/scripts/lib/styles.mjs}"
      run: node packages/web/scripts/build-styles.mjs && git add packages/web/styles/generated packages/web/registry/styles.json
    web-registry:
      glob: "{packages/web/components/**/*.tsx,packages/web/hooks/*.ts,packages/web/lib/*.ts,packages/web/styles/*.css,packages/web/bases/**,packages/web/scripts/build-registry.mjs,scripts/lib/registry.mjs,apps/ui/content/docs/**/*.mdx}"
      run: node packages/web/scripts/build-registry.mjs && git add packages/web/registry.json packages/web/registry
    mobile-registry:
      glob: "{packages/mobile/uniwind/components/**/*.tsx,packages/mobile/stylesheet/components/**/*.ts*,packages/mobile/components/primitives/**,packages/mobile/styles/uniwind.css,packages/mobile/scripts/*.mjs,packages/tokens/tokens.json,packages/mobile/swiftui/Sources/**/*.swift,packages/mobile/swiftui/Package.swift,packages/mobile/kotlin/ui/src/main/**/*.kt,packages/mobile/kotlin/ui/build.gradle.kts,packages/mobile/icons/map.json,scripts/lib/registry.mjs,apps/ui/content/docs/**/*.mdx}"
      run: node packages/mobile/scripts/build-tokens.mjs && node packages/mobile/scripts/build-nativewind.mjs && node packages/mobile/scripts/build-icons.mjs && node packages/mobile/scripts/build-registry.mjs && git add packages/mobile/icons packages/mobile/styles/uniwind.css packages/mobile/stylesheet/components/ui/theme.ts packages/mobile/swiftui/Sources/EsuissUI/Theme/Tokens.swift packages/mobile/kotlin/ui/src/main/kotlin/com/esuiss/ui/theme/Tokens.kt packages/mobile/nativewind packages/mobile/styles/nativewind.css packages/mobile/styles/nativewind.config.js packages/mobile/registry.json packages/mobile/registry

pre-push:
  parallel: true
  jobs:
    - name: check
      run: pnpm check
    - name: knip and typecheck
      group:
        piped: true
        jobs:
          - name: knip
            run: pnpm knip
          - name: typecheck
            run: pnpm typecheck
    - name: registry
      run: pnpm registry:check
    - name: test
      run: pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
