pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged
    web-registry:
      glob: "packages/web/{components/ui/*.tsx,components/patterns/*.tsx,components/interactions/*.tsx,components/charts/*.tsx,components/blocks/*.tsx,hooks/*.ts}"
      root: packages/web/
      run: node scripts/build-registry.mjs && git add registry.json
    site-sync:
      glob: "packages/web/{components/ui/*.tsx,components/patterns/*.tsx,components/interactions/*.tsx,components/charts/*.tsx,components/blocks/*.tsx,hooks/*.ts}"
      run: node scripts/sync-site.mjs && git add apps/ui/components apps/ui/hooks
    mobile-registry:
      glob: "{packages/mobile/uniwind/components/**/*.tsx,packages/mobile/stylesheet/components/**/*.ts*,packages/mobile/styles/uniwind.css,packages/tokens/tokens.json,packages/mobile/swiftui/Sources/**/*.swift,packages/mobile/swiftui/Package.swift,packages/mobile/kotlin/ui/src/main/**/*.kt,packages/mobile/kotlin/ui/build.gradle.kts}"
      root: packages/mobile/
      run: node scripts/build-tokens.mjs && node scripts/build-nativewind.mjs && node scripts/build-registry.mjs && git add styles/uniwind.css stylesheet/components/ui/theme.ts swiftui/Sources/EsuissUI/Theme/Tokens.swift kotlin/ui/src/main/kotlin/com/esuiss/ui/theme/Tokens.kt nativewind styles/nativewind.css styles/nativewind.config.js registry.json

pre-push:
  parallel: true
  commands:
    check:
      run: pnpm check
    knip:
      run: pnpm knip
    typecheck:
      run: pnpm typecheck
    registry:
      run: pnpm registry:check
    site-sync:
      run: node scripts/sync-site.mjs --check
    test:
      run: pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
