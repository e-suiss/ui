pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged
    web-registry:
      glob: "{packages/web/components/ui/*.tsx,packages/web/components/patterns/*.tsx,packages/web/components/interactions/*.tsx,packages/web/components/charts/*.tsx,packages/web/components/blocks/*.tsx,packages/web/hooks/*.ts,packages/web/lib/*.ts,packages/web/styles/*.css,apps/ui/content/docs/components/*.mdx,apps/ui/content/docs/patterns/*.mdx,apps/ui/content/docs/interactions/*.mdx,apps/ui/content/docs/charts/*.mdx,apps/ui/content/docs/blocks/*.mdx}"
      run: node packages/web/scripts/build-registry.mjs && git add packages/web/registry.json packages/web/registry/registry.json
    mobile-registry:
      glob: "{packages/mobile/uniwind/components/**/*.tsx,packages/mobile/stylesheet/components/**/*.ts*,packages/mobile/styles/uniwind.css,packages/tokens/tokens.json,packages/mobile/swiftui/Sources/**/*.swift,packages/mobile/swiftui/Package.swift,packages/mobile/kotlin/ui/src/main/**/*.kt,packages/mobile/kotlin/ui/build.gradle.kts}"
      run: node packages/mobile/scripts/build-tokens.mjs && node packages/mobile/scripts/build-nativewind.mjs && node packages/mobile/scripts/build-registry.mjs && git add packages/mobile/styles/uniwind.css packages/mobile/stylesheet/components/ui/theme.ts packages/mobile/swiftui/Sources/EsuissUI/Theme/Tokens.swift packages/mobile/kotlin/ui/src/main/kotlin/com/esuiss/ui/theme/Tokens.kt packages/mobile/nativewind packages/mobile/styles/nativewind.css packages/mobile/styles/nativewind.config.js packages/mobile/registry.json

pre-push:
  parallel: true
  commands:
    check:
      run: pnpm check
    knip:
      run: pnpm knip
    typecheck:
      run: pnpm typecheck
    registry:
      run: pnpm registry:check
    test:
      run: pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
