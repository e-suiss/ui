pre-commit:
  commands:
    lint-staged:
      run: pnpm exec lint-staged
    registry:
      glob: "{components/ui/*.tsx,styles/uniwind.css}"
      run: node scripts/build-nativewind.mjs && node scripts/build-registry.mjs && git add nativewind styles/nativewind.css styles/nativewind.config.js registry.json

pre-push:
  parallel: true
  commands:
    check:
      run: pnpm check
    typecheck:
      run: pnpm typecheck
    knip:
      run: pnpm knip
    registry:
      run: pnpm registry:check
    nativewind:
      run: pnpm nativewind:check

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
